# Central project configuration: dataset, paths, and pipeline parameters.
# Values here are consumed by the source modules to avoid hard-coded paths.

data:
  # Kaggle dataset slug (owner/dataset-name).
  kaggle_dataset: "blastchar/telco-customer-churn"
  # Original CSV file name as published on Kaggle.
  source_filename: "WA_Fn-UseC_-Telco-Customer-Churn.csv"
  # Normalized name used throughout the project.
  raw_filename: "telco_churn.csv"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  # File names of the processed train/test splits inside processed_dir.
  train_filename: "train.csv"
  test_filename: "test.csv"

paths:
  models_dir: "models"

preprocessing:
  # Target column and the value that represents the positive (churn) class.
  target: "Churn"
  positive_class: "Yes"
  # Identifier columns to drop (no predictive signal).
  drop_columns:
    - "customerID"
  # Columns stored as text in the raw file that must be coerced to numeric.
  numeric_coerce_columns:
    - "TotalCharges"
  # Train/test split settings.
  test_size: 0.2
  random_state: 42
  stratify: true

features:
  # Numeric features (standard-scaled at modeling time).
  numeric:
    - "tenure"
    - "MonthlyCharges"
    - "TotalCharges"
    - "SeniorCitizen"
  # Categorical features (one-hot encoded at modeling time).
  categorical:
    - "gender"
    - "Partner"
    - "Dependents"
    - "PhoneService"
    - "MultipleLines"
    - "InternetService"
    - "OnlineSecurity"
    - "OnlineBackup"
    - "DeviceProtection"
    - "TechSupport"
    - "StreamingTV"
    - "StreamingMovies"
    - "Contract"
    - "PaperlessBilling"
    - "PaymentMethod"

model:
  # Estimator key from the registry in src/model.py.
  name: "logistic_regression"
  # Keyword arguments forwarded to the estimator constructor.
  params:
    C: 1.0
    class_weight: "balanced"
    max_iter: 1000
    random_state: 42
