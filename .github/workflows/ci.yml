name: CI

on:
  pull_request:
  push:
    branches: [master]

# Only the latest run per branch is useful; cancelling the rest saves free minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Matches the version that trains and serves the model.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install --requirement requirements-dev.txt

      - name: Check formatting
        run: |
          black --check src tests
          isort --check-only src tests

      - name: Lint
        run: flake8 src tests

      - name: Run tests
        run: pytest

  image:
    name: Serving image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the serving image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: churn-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container
        run: docker run --detach --name churn-api --publish 8000:8000 churn-api:ci

      - name: Wait for the API to accept requests
        run: >
          curl --silent --show-error --fail --retry 30 --retry-delay 1
          --retry-all-errors --retry-connrefused --output /dev/null
          http://localhost:8000/docs

      - name: Report unavailable while no model is shipped
        run: |
          status=$(curl --silent --output response.json --write-out '%{http_code}' \
            http://localhost:8000/health)
          cat response.json
          test "$status" = "503"
          grep -q '"model_loaded":false' response.json

      - name: Show the container logs
        if: always()
        run: docker logs churn-api || true

      - name: Stop the container
        if: always()
        run: docker rm --force churn-api || true
